[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-adaptive_comm_agent"
version = "0.1.0"
description = "Adaptive Comm Agent environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "fastapi",
    "uvicorn",
    "requests",
    "huggingface_hub",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# UPDATED: Changed from adaptive_comm_agent.server.app to just app
server = "app:main"

[tool.setuptools]
include-package-data = true
# UPDATED: Removed the sub-package directory requirements
packages = ["."]
package-dir = { "" = "." }
