[project]
name = "adaptive-comm-agent"
version = "0.1.0"
description = "Adaptive Communication Agent for Meta OpenEnv Hackathon"
dependencies = [
    "fastapi",
    "uvicorn",
    "openai",
    "pydantic",
    "requests",
    "openenv-core>=0.2.0"
]

[project.scripts]
# This line is the 'entry point'. 
# It MUST point to the 'main' function inside 'server/app.py'
openenv-participant = "server.app:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
