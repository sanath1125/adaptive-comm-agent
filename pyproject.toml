[project]
name = "adaptive-comm-agent"
version = "0.1.0"
description = "Adaptive Communication Agent"
dependencies = [
    "fastapi",
    "uvicorn",
    "openai",
    "pydantic",
    "requests",
    "openenv-core>=0.2.0"
]

[project.scripts]
# We are providing multiple aliases to ensure the validator finds one
openenv-participant = "server.app:main"
adaptive-agent = "server.app:main"
server = "server.app:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
