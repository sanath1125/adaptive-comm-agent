[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-adaptive_comm_agent"
version = "0.1.0"
description = "Adaptive Comm Agent environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "fastapi",
    "uvicorn",
    "requests",
    "huggingface_hub",
    "python-dotenv",
]

[project.scripts]
# This line maps the 'server' command to the main() function in app.py
server = "server.app:main"

[tool.setuptools]
package-dir = { "" = "." }
packages = ["server"]
