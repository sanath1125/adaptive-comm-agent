[project]
name = "adaptive-comm-agent"
version = "0.1.0"
description = "Adaptive Communication Agent for Meta OpenEnv Hackathon"
dependencies = [
    "fastapi",
    "uvicorn",
    "openai",
    "pydantic",
    "requests"
]

[project.scripts]
# This maps the command to the main function in your app.py
adaptive-agent = "server.app:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
